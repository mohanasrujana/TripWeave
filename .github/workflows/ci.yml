name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: tripweave_ci
      DB_USER: tripweave_ci
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Start PostgreSQL/PostGIS
        run: docker compose up -d --wait --wait-timeout 120 database
      - name: Verify API
        working-directory: services/api
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Database diagnostics
        if: failure()
        run: docker compose logs --no-color database
      - name: Remove CI database
        if: always()
        run: docker compose down --volumes

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Select npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Verify web
        run: npm run check
